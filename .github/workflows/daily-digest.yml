name: Daily digest

# Sends the 8am push-notification summary by calling the daily-digest Edge Function.
#
# GitHub cron runs in UTC and is often a few minutes late, so it fires three times
# (07:03, 08:03, 09:03 UTC). The function only sends between 08:00 and 12:00 UK time
# and at most once per UK day, so whichever run lands first after 08:00 UK sends:
#   winter (GMT): the 08:03 UTC run; summer (BST): the 07:03 UTC run.
#
# Needs: repository variable VITE_SUPABASE_URL (already used by the deploy) and
# repository secret DIGEST_SECRET (the same value as the function's DIGEST_SECRET).

on:
  schedule:
    - cron: '3 7 * * *'
    - cron: '3 8 * * *'
    - cron: '3 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now, even outside 8am–12pm UK or if already sent today'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call daily-digest
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$DIGEST_SECRET" ]; then
            echo "::error::Set the VITE_SUPABASE_URL variable and the DIGEST_SECRET secret."
            exit 1
          fi
          # The response only contains counts (no names or job details), so it is safe in public logs.
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-all-errors --max-time 60 \
            -X POST "${SUPABASE_URL%/}/functions/v1/daily-digest" \
            -H 'Content-Type: application/json' \
            -H "x-digest-secret: ${DIGEST_SECRET}" \
            -d "{\"mode\":\"digest\",\"force\":${FORCE}}")
          cat response.json; echo
          if [ "$status" -ge 300 ]; then
            echo "::error::daily-digest returned HTTP $status"
            exit 1
          fi
